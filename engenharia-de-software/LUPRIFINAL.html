:root{

--ink:#0f1d19;--ink2:#3d514a;--ink3:#58695f;--line:rgba(15,29,25,.09);
--green:#5CD8A8;--green-soft:rgba(92,216,168,.16);--green-ring:rgba(92,216,168,.34);

--font:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
--fs-display:clamp(40px,5.4vw,68px);--fs-h1:clamp(30px,3.2vw,40px);--fs-h2:24px;--fs-lead:17px;--fs-title:21px;--fs-body:15px;--fs-ui:14px;--fs-sm:13px;--fs-label:12px;

--r-sm:12px;--r-md:18px;--r-lg:28px;--r-xl:36px;--r-pill:999px;

--glass-bg:linear-gradient(160deg,rgba(255,255,255,.76),rgba(255,255,255,.46));--glass-blur:blur(22px) saturate(1.7);
--shadow-glass:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(15,29,25,.045),0 18px 40px -22px rgba(15,29,25,.25);
--shadow-lift:0 16px 28px -18px rgba(15,29,25,.35);
--shadow-green:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px -8px rgba(92,216,168,.85);
--bg-fixed:radial-gradient(900px 520px at 100% 0,rgba(150,255,207,.22),transparent 70%),radial-gradient(800px 520px at 0 100%,rgba(92,216,168,.20),transparent 70%),linear-gradient(180deg,#f8faf9,#f1f5f3);
--bg-ambient:radial-gradient(50% 40% at 94% 0%,rgba(150,185,255,.30),transparent 70%),radial-gradient(45% 40% at 0% 100%,rgba(92,216,168,.28),transparent 70%),linear-gradient(180deg,#f8faf9,#f1f5f3);

}
html,body{margin:0}
*{box-sizing:border-box}
body{font-family:var(--font);font-size:var(--fs-body);line-height:1.6;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.h2{margin:0;font-size:var(--fs-h2);line-height:1.2;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.label{font-size:var(--fs-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

.glass{position:relative;background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow-glass)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.98),rgba(255,255,255,.16) 38%,rgba(255,255,255,.1) 62%,rgba(255,255,255,.85));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(250,252,251,.95)}}
.orb{position:absolute;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),inset 14px 20px 48px rgba(255,255,255,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.hd{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 40px}
.hd .l{flex:1 1 180px;display:flex}
.hd .r{flex:1 1 180px;display:flex;justify-content:flex-end;gap:8px}
.brand{display:flex;align-items:center;gap:12px}
.lupa{display:block;flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;box-shadow:0 10px 22px -10px rgba(92,216,168,.9)}
.lupa img{display:block;width:100%;height:100%}
.wm{position:relative;display:block;flex:none;width:83px;height:30px;overflow:hidden}
.wm img{position:absolute;max-width:none;width:106px;left:-11.2px;top:-22.1px}
.nav{display:flex;gap:2px;padding:4px;border-radius:var(--r-pill)}
.nav a{position:relative;z-index:1;height:40px;padding:0 20px;display:inline-flex;align-items:center;border-radius:var(--r-pill);font-size:var(--fs-ui);font-weight:500;color:var(--ink2);transition:background .2s,color .2s}
.nav a:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.nav a[aria-current]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,29,25,.08),0 6px 14px -6px rgba(15,29,25,.18)}
.ib{width:44px;height:44px;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center;color:var(--ink2);flex:none;transition:transform .2s,color .2s,background .2s}
.ib:hover{color:var(--ink);background:rgba(255,255,255,.7);transform:translateY(-1px)}
.ib.glass{background:var(--glass-bg)}
.ib.glass:hover{background:#fff}
.av{font-size:var(--fs-ui);font-weight:600;color:var(--ink)}
@media (max-width:760px){.hd{padding:16px 20px}.nav{order:3;flex:1 1 100%;justify-content:center}}
.go{border-radius:50%;border:0;display:grid;place-items:center;flex:none;color:var(--ink);background:var(--green);box-shadow:var(--shadow-green);transition:transform .2s}
.go:hover{transform:scale(1.06)}
.field{display:flex;align-items:center;gap:12px;border-radius:var(--r-pill);background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(15,29,25,.06),0 1px 2px rgba(15,29,25,.04);color:var(--ink3);transition:box-shadow .2s}
.field:focus-within{box-shadow:0 0 0 1.5px var(--green),0 0 0 5px var(--green-ring)}

.v-area .pc{height:max(640px,calc(100vh - 140px))}
.msgs{max-height:none!important;min-height:0}

.v-area [hidden]{display:none!important}
.v-area .pscroll{position:relative;flex:1;min-height:0;overflow-y:auto;padding:16px 2px 8px;display:flex;flex-direction:column;gap:14px}
.v-area .pcard{flex:none;padding:20px 22px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px rgba(15,29,25,.06),0 12px 24px -16px rgba(15,29,25,.25)}
.v-area .pcard h3{margin:2px 0 0;font-size:var(--fs-title);line-height:1.25;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.v-area .pcard p{margin:8px 0 0;font-size:var(--fs-ui);line-height:1.7;color:var(--ink)}
.v-area .pcard p.mu{color:var(--ink3);margin:6px 0 0}
.v-area .pcard .fl{margin-top:14px}
.v-area .pcard .fl small{display:block;margin-bottom:4px;font-size:var(--fs-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.v-area .pcard .fl p{margin:0}
.v-area .pcard .fl p+p{margin-top:6px}
.v-area .pcard .qt{padding:12px 14px;border-radius:14px;background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--green-ring)}
.v-area .phead{display:flex;align-items:flex-start;gap:12px}.v-area .phead>div:first-child{flex:1;min-width:0}
.v-area .pbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.v-area .pk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.v-area .tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--green-soft);color:var(--ink);font-size:var(--fs-label);font-weight:600}
.v-area .pcard .chip,.v-area .pbar .chip{height:36px;padding:0 14px;font-size:var(--fs-sm);flex:none}
.v-res .addrow{margin-bottom:16px}
.v-res .pbar,.v-res .pk,.v-area .scope .pk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.v-res .pk .chip{height:36px;padding:0 14px;font-size:var(--fs-sm)}
.v-res .refbox .chip{height:36px;padding:0 14px}
.v-res .lgp .prow{width:100%}
.v-res .qc .label{align-self:center;margin:0 4px 0 2px}
.v-area .scope{margin:0 4px 18px}
.v-area .scope .label{display:block;margin-bottom:8px}
.v-area .scope .chip{height:34px;padding:0 14px;font-size:var(--fs-sm)}
.v-area .scope .mu a{color:inherit}

.v-home .h-title{margin:0;font-size:clamp(30px,3.8vw,48px);line-height:1.1;font-weight:600;letter-spacing:-.032em;color:var(--ink)}
.v-home .h-lead{margin:16px 0 0;font-size:var(--fs-body);line-height:1.55;color:var(--ink2);max-width:480px;text-wrap:balance}
.v-home .hsearch{width:100%;max-width:1060px;margin-top:36px;padding:10px 12px 12px;border-radius:34px;

.v-home .hsearch .field{height:60px;padding:0 7px 0 24px;border-radius:26px;

.v-home .hsearch .go{width:46px;height:46px}
.v-home .hsearch .chips{padding:10px 4px 0}

.page.v-home{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.v-home main{flex:1;padding-top:clamp(36px,10vh,120px)!important;padding-bottom:clamp(24px,4vh,48px)!important}
.v-home .h-lead{margin-top:clamp(14px,2vh,22px)}
.v-home .hsearch{margin-top:clamp(32px,6vh,64px)}

 if(bs<1)return"Não encontrei nas suas fontes um trecho sobre isso. Tente outra pergunta ou adicione mais fontes.";

  if(!window.pdfjsLib){const V="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";await loadScript(V+"pdf.min.js");const w=await (await fetch(V+"pdf.worker.min.js")).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:"text/javascript"}))}
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out="";
  for(let i=1;i<=pdf.numPages&&out.length<LIM*1.5;i++){const pg=await pdf.getPage(i),c=await pg.getTextContent();out+=c.items.map(x=>x.str).join(" ")+"\n"}
  if(out.replace(/\s/g,"").length<40)throw new Error("Este PDF não tem texto selecionável (parece escaneado).");return out}
 if(/\.docx$/.test(n)){if(!window.mammoth)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
 if(/\.(txt|md|csv|tsv|json|xml|srt|tex|bib|html?)$/.test(n)||/^text\//.test(f.type)){const t=await f.text();return /\.html?$/.test(n)?htmlTx(t):t}
 throw new Error("Formato não suportado. Use PDF, DOCX, TXT, MD, CSV ou HTML.")}
async function urlText(u){const get=async x=>{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);try{const r=await fetch(x,{signal:ac.signal});if(!r.ok)throw new Error("http "+r.status);return await r.text()}finally{clearTimeout(tm)}};
 let t="";try{t=htmlTx(await get(u))}catch(e){}
 if(cleanTx(t).length<200){try{t=await get("https://r.jina.ai/"+u)}catch(e){}}
 if(cleanTx(t).length<80)throw new Error("Não consegui abrir este link (o site pode bloquear leitura). Baixe a página ou o PDF e envie como arquivo.");return t}
function addItem(k,ti,au,reader){const r={k,au,ti,y:"",p:"—",x:"Material adicionado: "+ti,ref:ti,sq:"",rd:"busy"};S.saved.push(r);
 reader().then(t=>{t=cleanTx(t);if(t.length<40)throw new Error("Não encontrei texto neste material.");r.n=t.length;r.abs=t.slice(0,LIM);r.x=r.abs.slice(0,280);delete r.rd}).catch(e=>{r.rd="fail";r.err=String(e&&e.message||"Não consegui ler este material.").slice(0,200)}).then(()=>{persist();if(S.view!=="home")render();else toast(r.rd?"Não consegui ler: "+ti:"Fonte lida: "+ti)})}
const isUrl=v=>!/\s/.test(v)&&/^(https?:\/\/|www\.)|^[\w-]+(\.[\w-]+)+(\/|$)/i.test(v);
function addSrc(){const v=(($("ad")||{}).value||"").trim();if(!v)return;S.adding=false;
 if(isUrl(v)){const u=/^https?:\/\//i.test(v)?v:"https://"+v;addItem("Link",v,"WEB",()=>urlText(u))}
 else{S.saved.push({k:"Link",au:"WEB",ti:v,y:"",p:"—",x:"Material adicionado: "+v,ref:v,sq:"",rd:"fail",err:"Só o título foi salvo. Para a IA ler o conteúdo, cole o link ou envie o arquivo."})}
 toast("Lendo a fonte...");render()}
/* ---------- painéis ---------- */
function popHTML(p){
 if(p==="hist")return`<h3 class="label">Histórico</h3>${S.hist.length?S.hist.map(q=>`<button type="button" class="prow" data-act="rec" data-q="${esc(q)}"><span class="ico">${I(P.clock,18)}</span><span style="flex:1">${esc(q)}</span>${I(P.chev,16)}</button>`).join("")+`<button type="button" class="chip" data-act="hist-clear" style="margin-top:12px;height:40px">Limpar histórico</button>`:`<p class="mu">Nenhuma pesquisa ainda. Suas buscas aparecem aqui.</p>`}`;
 if(p==="help")return`<h3 class="label">Ajuda</h3><details open><summary>Como buscar?</summary><p>Digite um tema, autor ou palavra-chave. O Lupri mostra o trecho exato de cada obra, com página e relevância.</p></details><details><summary>Como salvar fontes?</summary><p>Em cada resultado, toque em Salvar. As fontes vão para a Área de pesquisa, onde também dá para adicionar links e arquivos.</p></details><details><summary>Como gerar referências?</summary><p>Use Citar nos resultados, ou os botões do Estúdio para gerar resumo, citações ABNT e fichamento.</p></details><details><summary>Atalhos</summary><p>Enter envia a busca e as mensagens. Esc fecha este painel.</p></details>`;
 if(p==="notif")return`<h3 class="label">Notificações</h3>${S.notifs.length?S.notifs.map(n=>`<div class="prow nt${n.u?" u":""}"><span class="ico">${I(P.bell,18)}</span><div class="tx"><b>${esc(n.t)}</b>${ago(n.d)}</div></div>`).join("")+`<button type="button" class="chip" data-act="notif-read" style="margin-top:12px;height:40px">Marcar como lidas</button>`:`<p class="mu">Tudo em dia.</p>`}`;
 if(p==="fil")return`<h3 class="label">Filtros de busca</h3>${filters()}<button type="button" class="chip" data-act="clear" style="height:40px">Limpar filtros</button>`;
 const ar=["","Educação","Saúde","Tecnologia","Humanidades","Ciências exatas","Outra"].map(a=>`<option value="${a}"${S.prof.area===a?" selected":""}>${a||"Selecione"}</option>`).join("");
 return`<h3 class="label">Perfil</h3><div style="display:flex;align-items:center;gap:12px;margin:8px 0 6px"><span class="ib glass av" style="pointer-events:none">${ini()||"G"}</span><div><b>${esc(S.prof.name||"Visitante")}</b><div class="mu">${S.saved.length} fontes · ${S.hist.length} pesquisas</div></div></div><label class="fl">Nome<input class="inp" id="pn" value="${esc(S.prof.name)}" autocomplete="off"></label><label class="fl">E-mail<input class="inp" id="pe" type="email" value="${esc(S.prof.email)}" autocomplete="off"></label><label class="fl">Área de estudo<select class="inp" id="pa">${ar}</select></label><label class="fl">Chave da IA (Gemini grátis ou Anthropic)<input class="inp" id="pk" type="password" autocomplete="off" placeholder="${localStorage.getItem("lupri-key")?"Chave salva (cole outra para trocar)":"AIza... ou sk-ant-..."}"><span class="mu" style="display:block;margin-top:4px;font-size:12px;font-weight:400">Chave grátis em aistudio.google.com/apikey</span></label><label class="fl">Chave do OpenAlex (grátis, evita o limite de buscas)<input class="inp" id="pok" type="password" autocomplete="off" placeholder="${localStorage.getItem("lupri-oakey")?"Chave salva (cole outra para trocar)":"Cole a chave do OpenAlex"}"></label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button type="button" class="chip on" data-act="prof-save" style="height:40px">Salvar perfil</button><button type="button" class="chip" data-act="ai-test" style="height:40px">Testar IA</button><button type="button" class="chip" data-act="prof-reset" style="height:40px">${S.confirm?"Confirmar limpeza":"Limpar meus dados"}</button></div>`}
function refreshPop(){$("pop").innerHTML=S.pop?`<div class="pop glass" role="dialog" aria-label="Painel">${popHTML(S.pop)}</div>`:""}
function openPop(p){S.pop=p;S.confirm=false;refreshPop()}
function closePop(){S.pop=null;$("pop").innerHTML=""}
function refreshModal(){const r=S.modal;$("modal").innerHTML=r?`<div class="mback" data-act="closem"><div class="mdlg glass" role="dialog" aria-label="${esc(r.ti)}"><div class="meta"><span class="tag">${r.k}</span><span>${esc(r.src)}</span><span class="dot"></span><span>${r.y}</span><span class="dot"></span><span>${r.l}</span></div><h3>${esc(r.ti)}</h3><p class="au">${esc(nm(r.au))}</p><p class="ab">“${hl(r.x)}”</p><div class="meta" style="margin-top:10px"><span>Página ${r.p}</span><span class="dot"></span><span>Relevância ${r.s}%</span><span class="dot"></span><span>${r.a==="Aberto"?"Acesso aberto":"Por assinatura"}</span></div><div class="rbox"><small>Referência · ABNT</small><p>${esc(r.ref)}</p></div>${r.url?`<p class="mu"><a href="${esc(r.url)}" target="_blank" rel="noopener" style="text-decoration:underline">Abrir fonte original</a></p>`:""}<div class="macts"><button type="button" class="chip" data-act="m-ref">${I(P.doc,16)}Copiar referência</button><button type="button" class="chip" data-act="m-cit">${I(P.lines,16)}Copiar citação</button><button type="button" class="chip${saved(r)?" on":""}" data-act="m-save">${I(P.mark,16)}${saved(r)?"Salvo":"Salvar"}</button><button type="button" class="chip" data-act="closem">Fechar</button></div></div></div>`:""}
/* ---------- eventos ---------- */
document.addEventListener("click",e=>{if(S.pop&&!e.target.closest(".pop")&&!e.target.closest('[data-act="pop"]'))closePop();
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.getAttribute("data-act"),i=+b.getAttribute("data-i");
 if(b.tagName==="A")e.preventDefault();
 if(a==="closem"&&e.target.closest(".mdlg")&&b.classList.contains("mback"))return;
 if(S.pop&&b.closest(".pop")&&!["hist-clear","notif-read","prof-save","prof-reset","ai-test","clear"].includes(a)&&a!=="pop")closePop();
 const r=S.list[i];
 switch(a){
 case"pop":{const p=b.getAttribute("data-p");S.pop===p?closePop():openPop(p);break}
 case"home":S.q="";S.draft="";S.loading=false;S.period="all";S.from=S.to="";S.types={};S.langs={};S.acc={};go("home");break;
 case"bib":S.libf="all";go("lib");break;
 case"ws":go("area","bib");break;
 case"libf":S.libf=b.getAttribute("data-k");render();break;
 case"libadd":S.adding=!S.adding;S.newp=false;render();{const a=$("ad");if(a)a.focus()}break;
 case"lopen":S.modal=S.saved[i];refreshModal();break;
 case"lcite":{const q=S.saved[i];S.cite[q.ref]=!S.cite[q.ref];render();break}
 case"lcpref":copy(S.saved[i].ref,"Referência copiada");break;
 case"lcpcit":copy(cite(S.saved[i]),"Citação copiada");break;
 case"est":go("area","est");break;
 case"type":S.type=b.getAttribute("data-k");render();break;
 case"area":S.areaOpen=S.areaOpen===i?null:i;render();break;
 case"asub":search(b.getAttribute("data-q"),true);break;
 case"all":S.areaOpen=S.areaOpen==="all"?null:"all";render();break;
 case"areas":S.draft="";S.areaOpen="all";go("home");setTimeout(()=>{const s=$("areas");if(s)s.scrollIntoView({behavior:"smooth"})},30);break;
 case"rec":search(b.getAttribute("data-q"));break;
 case"more":S.moreRel=!S.moreRel;render();break;
 case"quick":{const k=b.getAttribute("data-k");S.quick[k]=!S.quick[k];render();break}
 case"clear":S.period="all";S.from=S.to="";S.types={};S.langs={};S.acc={};S.quick={};render();if(S.pop==="fil")refreshPop();break;
 case"clearq":S.draft="";render();{const q=$("q");if(q)q.focus()}break;
 case"open":S.modal=r;refreshModal();break;
 case"closem":S.modal=null;refreshModal();break;
 case"m-ref":copy(S.modal.ref,"Referência copiada");break;
 case"m-cit":copy(cite(S.modal),"Citação copiada");break;
 case"m-save":toggleSave(S.modal);break;
 case"save":toggleSave(r);break;
 case"cite":S.cite[r.ref]=!S.cite[r.ref];render();break;
 case"cpref":copy(r.ref,"Referência copiada");break;
 case"cpcit":copy(cite(r),"Citação copiada");break;
 case"back":go("results");break;
  case"addok":addSrc();break;
 case"file":$("fi").click();break;
 case"rm":S.saved.splice(i,1);render();toast("Fonte removida");break;
 case"newchat":S.cur=null;S.panel="chat";S.mdraft="";render();break;
 case"openconv":S.panel="chat";S.cur=+b.getAttribute("data-id");S.scope=(x=>x&&x.scope&&S.projects.some(p=>p.id===x.scope)?x.scope:null)(conv());render();break;
 case"delconv":{const id=+b.getAttribute("data-id");S.convs=S.convs.filter(c=>c.id!==id);if(S.cur===id)S.cur=null;render();toast("Conversa excluída");break}
 case"sugg":ask(b.getAttribute("data-t"));break;
 case"st":S.panel=b.getAttribute("data-k");render();break;
 case"aicp":copy((S.ai[b.getAttribute("data-k")]||{}).t||"","Copiado");break;
 case"airg":{const k=b.getAttribute("data-k");(S.aiFresh=S.aiFresh||{})[k]=1;delete S.ai[k];render();break}
 case"pcp":{const k=b.getAttribute("data-k"),sv=pool(),q=sv[i],kk=sv.filter(kn);let t,m="Copiado";
  if(k==="ref"){t=q.ref;m="Referência copiada"}else if(k==="cd"){t=direta(q);m="Citação direta copiada"}else if(k==="ci"){t=indireta(q);m="Citação indireta copiada"}else if(k==="fi"){t=fichaTxt(q);m="Fichamento copiado"}
  else if(k==="allref"){t=sortRef(sv).map(r=>r.ref).join("\n\n");m="Referências copiadas"}else if(k==="allcit"){t=kk.map(r=>direta(r)).join("\n\n");m="Citações copiadas"}
  else if(k==="allfi"){t=sv.map(fichaTxt).join("\n\n---\n\n");m="Fichamentos copiados"}
  else if(k==="res"){const d=resumoTxt(i);t=D[i].n+"\n\n"+d.p1+"\n\n"+d.p2+"\n\n"+d.p3;m="Resumo copiado"}
  copy(t,m);break}
 case"newp":S.newp=!S.newp;S.adding=false;render();{const x=$("pn");if(x)x.focus()}break;
 case"pcreate":createProj();break;
 case"lproj":{const q=S.saved[i];S.pm=S.pm===q.ref?null:q.ref;render();break}
 case"ptog":{const q=S.saved[i],p=S.projects.find(x=>x.id===+b.getAttribute("data-id"));if(!p)break;const k=p.refs.indexOf(q.ref);if(k>-1)p.refs.splice(k,1);else p.refs.push(q.ref);render();toast(k>-1?"Removida de "+p.name:"Adicionada a "+p.name);break}
 case"pmg":S.pmg=!S.pmg;render();break;
 case"pdel":{const id=+b.getAttribute("data-id");if(S.pdc!==id){S.pdc=id;render();break}S.projects=S.projects.filter(x=>x.id!==id);S.convs.forEach(c=>{if(c.scope===id)c.scope=null});if(S.scope===id)S.scope=null;S.libf="all";S.pdc=null;S.pmg=false;render();toast("Projeto excluído");break}
 case"pchat":S.scope=+b.getAttribute("data-id");S.cur=null;S.panel="chat";go("area","est");break;
 case"scope":{S.scope=+b.getAttribute("data-id")||null;const c=conv();if(c){c.scope=S.scope;if(c.msgs.length){const p=curProj();push(c,"a",p?`<span class="mu">Agora usando o projeto <b>${esc(p.name)}</b> (${pool().length} ${pool().length===1?"fonte":"fontes"}).</span>`:`<span class="mu">Agora usando todas as fontes (${S.saved.length}).</span>`)}}render();break}
 case"hist-clear":S.hist=[];persist();refreshPop();toast("Histórico limpo");render();break;
 case"notif-read":S.notifs.forEach(n=>n.u=false);render();refreshPop();break;
 case"ai-test":aiTest();break;
 case"prof-save":{const k=($("pk")||{}).value,o=($("pok")||{}).value;if(k&&k.trim())localStorage.setItem("lupri-key",k.trim());if(o&&o.trim())localStorage.setItem("lupri-oakey",o.trim())}S.prof={name:$("pn").value.trim(),email:$("pe").value.trim(),area:$("pa").value};S.confirm=false;notify("Perfil atualizado");refreshPop();break;
 case"prof-reset":if(!S.confirm){S.confirm=true;refreshPop()}else{S.saved=[];S.hist=[];S.convs=[];S.cur=null;S.projects=[];S.scope=null;S.libf="all";S.sess="";S.prof={name:"",email:"",area:""};S.confirm=false;S.q=S.draft="";S.base=[];S.notifs=[];try{localStorage.removeItem("lupri-v2")}catch(x){}gmCacheClear();closePop();go("home");toast("Dados apagados")}break}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();if(f.dataset.form==="search")search($("q").value);else{const m=$("m"),q=(m.value||"").trim();if(q)ask(q)}});
document.addEventListener("input",e=>{if(e.target.id==="q")S.draft=e.target.value;else if(e.target.id==="m")S.mdraft=e.target.value});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="fi"){const fs=Array.prototype.slice.call(t.files);fs.forEach(f=>addItem("Arquivo",f.name,"UPLOAD",()=>fileText(f)));t.value="";if(fs.length){S.adding=false;toast("Lendo "+fs.length+" arquivo(s)...");render()}return}
 const f=t.getAttribute("data-f");if(!f)return;
 if(f==="period")S.period=t.value;else if(f==="type")S.types[t.value]=t.checked;else if(f==="lang")S.langs[t.value]=t.checked;else if(f==="acc")S.acc[t.value]=t.checked;else if(f==="sort")S.sort=t.value;else if(f==="from")S.from=t.value.replace(/\D/g,"");else if(f==="to")S.to=t.value.replace(/\D/g,"");
 render();if(S.pop==="fil")refreshPop()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePop();if(S.modal){S.modal=null;refreshModal()}return}if(e.key==="Enter"&&e.target.id==="ad"){e.preventDefault();addSrc()}if(e.key==="Enter"&&e.target.id==="pn"){e.preventDefault();createProj()}});
load();render();
