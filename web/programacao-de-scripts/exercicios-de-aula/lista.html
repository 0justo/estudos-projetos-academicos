<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Compras</title>
  </head>
  <body>
    <h1>Lista de Compras Não ordenada</h1>
    <!--O tag ul cria uma lista não ordenada também conhecida como marcadores-->
    <ul>
      <li>Banana</li>
      <li>Café</li>
      <li>Batata</li>
      <li>Frango</li>
      <li>Pão de Forma</li>
      <li>Manteiga</li>
    </ul>

    <h1>Lista de Compras Ordenada</h1>
    <!--O tag ol cria uma lista ordenada numericamente-->
    <ol>
      <li>Banana</li>
      <li>Café</li>
      <li>Batata</li>
      <li>Frango</li>
      <li>Pão de Forma</li>
      <li>Manteiga</li>
    </ol>
  </body>
</html>
