<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatório de Vendas</title>
  </head>
  <body>
    <h1 align ="center">Relatório de Vendas</h1>
    <!--O tag table define uma tabela, o tag tr define linha e td define a cédula-->
    <table
      align ="center"
      border="2"
      bgcolor="aqua"
      cellspacing="2"
      cellpadding="10"
    >
      <tr>
        <td align="center">Imagem</td>
        <td align="center">Produto</td>
        <td align="center">Quantidade</td>
        <td align="center">Preço(R$)</td>
      </tr>
      <tr>
        <td><img src="./img/tv.png"> </td>
        <td align="center">Televisor</td>
        <td align="center">2</td>
        <td align="center">3.000,00</td>
      </tr>
      <tr>
        <td><img src="./img/geladeira.png"></td>
        <td align="center">Geladeira</td>
        <td align="center">4</td>
        <td align="center">1.990,00</td>
      </tr>
      <tr>
        <td><img src="./img/fogao.jpg"></td>
        <td align="center">Fogão</td>
        <td align="center">3</td>
        <td align="center">600,00</td>
      </tr>
      <tr>
        <td><img src= "./img/computador.jpg"></td>
        <td align="center">Computador</td>
        <td align="center">3</td>
        <td align="center">4500,00</td>
      </tr>
    </table>

    <img src="./img/rodrygo.png">
  </body>
</html>
