    <h1>Produto</h1>

      <tr>
        <td align="right">Descrição:</td>
        <td>
          <input type="text" id="desc" value="" size="20" maxlength="20" />
        </td>
      </tr>

        <td align="right">Quantidade:</td>

      <tr>

      </tr>

      <tr>

        <td><input type="text" id="total" value="" size="10" readonly /></td>
      </tr>
    </table>
    <div id="msgErro" style="color: brown"></div>
    <script src="produto-0.js">
      desc.addEventListener("blur", validarDescricao);
      qtd.addEventListener("blur", validarQuantidade);
      unit.addEventListener("blur", validarPreco);
      calc.addEventListener("click", calcular);

      function validarDescricao() {
      if (desc.value.trim()==="") {
        msgErro.innerHTML="Preencha a descrição do produto!";
        desc.style.background="yellow";
        desc.focus();
        return false;
      }
      else {
        desc.style.background="white";
        msgErro.innerHTML="";

      }
      }
