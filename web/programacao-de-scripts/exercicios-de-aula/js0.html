<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caixas de diálogo e mensagem</title>
  </head>
  <body>
    <h1>Caixas de diálogo e mensagem</h1>
    <input type="button" value="Login" onclick="login()" />
    <script>
      function login() {
        var nome = prompt("Digite seu nome:", "Zé Ninguém");
        alert("Boa tarde" + nome + "!");
      }
    </script>
  </body>
</html>
