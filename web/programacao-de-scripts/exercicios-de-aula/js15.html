<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interação entre páginas</title>
  </head>
  <body>
    <h1>Interação entre páginas</h1>
    Digite um valor ou utilize a
    <input type="button" value="calculadora" id="calc" />:
    <input type="text" id="valor" value="0" />
    <script>
      calc.addEventListener("click", abrirCalc);
      window.addEventListener(
        "message",
        function (evento) {
          valor.value = evento.data;
        },
        false,
      );
      function abrirCalc() {
        var janela = window.open(
          "calculadora.html",
          "Calculadora",
          "toolbar=no, \
location=no,directories=no,status=no,menubar=no, \
scrollbars=no,resizable=no,menubar=no,top=250,left=450, \
width=200,height=300",
        );
      }
    </script>
  </body>
</html>
