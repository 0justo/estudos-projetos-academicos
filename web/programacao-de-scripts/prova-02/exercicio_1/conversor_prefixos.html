<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="conversor_prefixos.css" />
    <title>Calculadora de prefixos</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  </head>
  <body>
    <h1>Conversor de medidas</h1>
    <p>
        Digite o valor:
        <input type="text" id="valor1" value="0">
    </p>
    <label for="prefixo">Escolha o prefixo:</label>
    <select id="prefixo" name="Medidas">
    <option value="k">Kilo</option>
    <option value="m" selected>Mega</option>
    <option value="g">Giga</option>
    <option value="t">Tera</option>
    </select>
    </br><input type="button" id="btcalcular" value="CALCULAR">
    <div id="res"></div>
    <script type="text/javascript" src="./conversor_prefixos.js"></script>
  </body>
</html>
